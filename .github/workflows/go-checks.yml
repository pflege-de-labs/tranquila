name: Go checks

# Called by ci.yml on every PR and main push, and by release.yml on a tag.
# One definition so the e2e invocation cannot drift between the two.
on:
  workflow_call:
    inputs:
      run-e2e:
        description: Run the container-backed end-to-end suite.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The e2e module is not covered by the commands above (go does not descend
      # into nested modules), so vet it here to catch compile breakage even when
      # the container-backed job is skipped.
      - name: Vet e2e module
        working-directory: e2e
        run: go vet ./...

      # e2e has a `replace` to ../, so every direct dependency of the root module
      # is an indirect one of e2e's. A root bump that does not re-tidy e2e leaves
      # that module broken, and the failure surfaces as an opaque "updates to
      # go.mod needed" from whichever command happens to load it first. Checking
      # it by name makes the cause obvious and catches drift from any source, not
      # just Renovate.
      - name: Check both modules are tidy
        run: |
          go mod tidy
          (cd e2e && go mod tidy)
          if ! git diff --quiet -- go.mod go.sum e2e/go.mod e2e/go.sum; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' in the repo root and in e2e/"
            git --no-pager diff -- go.mod go.sum e2e/go.mod e2e/go.sum
            exit 1
          fi

  e2e:
    name: End-to-End (Silo + Toxiproxy)
    if: inputs.run-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      # The suite skips rather than fails when it finds no runtime, so without
      # this a runner without Docker would turn the gate into a green no-op.
      - name: Fail fast if no container runtime is reachable
        run: docker info > /dev/null

      # Docker is preinstalled on ubuntu-latest and testcontainers finds
      # /var/run/docker.sock unaided, so no runtime setup is needed here. The
      # podman handling in e2e/runtime_test.go is inert on this runner.
      - name: Run end-to-end tests
        working-directory: e2e
        run: go test -v -timeout 30m ./...

  vuln-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
