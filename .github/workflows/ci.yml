name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A branch with no open PR gets no image otherwise. Dispatching runs against
  # the base repo with a full token and OIDC, so push and signing work as usual.
  workflow_dispatch:

# A PR gets a fresh run per push and the superseded one is pointless; main
# pushes are not cancelled because each commit must produce its own image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The shared workflows and what they do are described in docs/adr/0008-shared-workflows.md.
jobs:
  # e2e/go.mod has a `replace` to ../, so a root bump that does not re-tidy e2e
  # breaks it; modules lists both so the tidy check names the cause.
  checks:
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      go-version: stable
      modules: ". e2e"
      # gosec reports findings that predate this workflow; enable it once they are fixed.
      gosec-version: ""

  e2e:
    uses: ./.github/workflows/e2e.yml

  # The valkey dependency is vendored under charts/tranquila/charts, so neither
  # lint nor template needs registry access.
  chart:
    uses: pflege-de-labs/github-workflows/.github/workflows/helm-lint.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      chart: charts/tranquila
      assert-command: scripts/check-chart-render.sh charts/tranquila

  # No image ever exists for a commit whose tests failed.
  image:
    needs: [checks, e2e]
    uses: pflege-de-labs/github-workflows/.github/workflows/image-build.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write

  # A transient PR branch has no reason to leave a trace in a findings tool.
  secobserve:
    needs: image
    if: github.event_name != 'pull_request'
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ needs.image.outputs.short-sha }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
