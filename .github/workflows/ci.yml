name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A branch with no open PR gets no image otherwise. Dispatching runs against
  # the base repo with a full token and OIDC, so push and signing work as usual.
  workflow_dispatch:

# A PR gets a fresh run per push and the superseded one is pointless; main
# pushes are not cancelled because each commit must produce its own image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Run directly rather than through upstream's upload_sbom action, whose
  # entrypoint cannot report failure. See docs/adr/0007-secobserve-upload-correctness.md.
  SCANNER_IMAGE: ghcr.io/secobserve/secobserve-scanners:2026_08@sha256:7dd952f02a9a8262b61399bb65abdeea9c8b5b8628aa4788ba7d411d198931ab

jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml
    permissions:
      contents: read

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # helm ships on the runner image, so there is no action to pin here. The
      # valkey dependency is vendored under charts/tranquila/charts, so neither
      # lint nor template needs registry access.
      - name: Lint every values combination
        run: |
          for values in charts/tranquila/ci/*-values.yaml; do
            echo "::group::lint $values"
            helm lint charts/tranquila --values "$values"
            echo "::endgroup::"
          done

      # Each values file is a deployment shape that reaches templates the others
      # do not: a bad edit breaks exactly one of them and nothing else notices.
      - name: Render every deployment shape
        run: |
          for values in charts/tranquila/ci/*-values.yaml; do
            echo "::group::template $values"
            helm template tranquila charts/tranquila --values "$values"
            echo "::endgroup::"
          done

      # Rendering proves the chart is not broken; it says nothing about a chart
      # that is quietly wrong. These assert what actually comes out.
      - name: Assert what the chart renders
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The credentials/config a user manages out of band must suppress the
          # chart's own objects. Both keys are documented at the top level and
          # were previously read from under `config`, so the documented form
          # rendered a Secret anyway and failed on its `required` calls.
          out=$(helm template tranquila charts/tranquila \
                  --values charts/tranquila/ci/existing-secret-values.yaml)
          echo "$out" | grep -q "name: tranquila-s3-credentials" \
            || fail "existingSecret is not mounted"
          echo "$out" | grep -q "name: tranquila-sync-config" \
            || fail "existingConfig is not mounted"
          if echo "$out" | grep -qE "^  name: tranquila-tranquila-config$"; then
            fail "chart rendered its own config objects despite existingSecret/existingConfig"
          fi

          # The nested form predates the documented one and must keep working.
          helm template tranquila charts/tranquila \
            --set config.existingSecret=legacy-secret \
            --set config.existing=legacy-cm >/dev/null \
            || fail "nested config.existingSecret/config.existing no longer renders"

          # Disabling the subchart must actually drop it.
          if helm template tranquila charts/tranquila \
               --values charts/tranquila/ci/external-redis-values.yaml \
               | grep -q "valkey"; then
            fail "valkey rendered while valkey.enabled=false"
          fi

          # The image default must track this repository, not the old owner.
          helm template tranquila charts/tranquila \
            --values charts/tranquila/ci/default-values.yaml \
            | grep -q '"ghcr.io/pflege-de-labs/tranquila:' \
            || fail "image default does not point at ghcr.io/pflege-de-labs/tranquila"

          echo "chart render assertions passed"

  # needs: checks keeps the guarantee the old workflow_run arrangement gave —
  # no image ever exists for a commit whose tests failed.
  image:
    name: Image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pull requests from forks get no registry credentials and no OIDC token,
      # so they build only and are not signed.
      - name: Decide whether the image can be pushed
        id: push
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request the checked-out HEAD is the merge commit, which exists
      # in no one's clone, so the tag comes from the head commit instead.
      - name: Resolve the commit being built
        id: commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          # :latest belongs to releases only, see docs/adr/0001-ci-cd-pipeline.md.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.commit.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      # provenance: false is deliberate — build-push-action would otherwise
      # attach mode=min provenance, an extra manifest GHCR renders as an
      # unknown/unknown row, asserting only what the cosign signature already
      # proves cryptographically. Releases do carry full provenance. sbom:
      # true does the same job release.yml already relies on: the SBOM
      # SecObserve gets below is this attestation, not a second, separately
      # generated one.
      - name: Build the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          build-args: |
            VERSION=${{ steps.commit.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outputs.enabled == 'true'

      # Keyless: the signing identity is this workflow's OIDC token, so there
      # is no private key to hold. Signing by digest covers every tag at once.
      # Skipped for fork builds, which export nothing and so have no digest.
      - name: Sign the image
        if: steps.push.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Scanning and SBOM upload are skipped for pull_request builds entirely
      # (not just forks): SecObserve auto-creates a "branch" per SO_BRANCH_NAME
      # on first import, and a transient PR branch has no reason to leave a
      # permanent-ish trace in a findings tool — main and workflow_dispatch
      # builds are what actually matters to track over time.
      # buildx keys a multi-platform image's .SBOM by platform and SecObserve
      # detects only a bare SPDX document, hence the unwrap and the guard — see
      # docs/adr/0007-secobserve-upload-correctness.md.
      - name: Extract the image's SBOM attestations to files
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom-raw.json
          for platform in linux/amd64 linux/arm64; do
            out="sbom-$(echo "$platform" | tr '/' '-').json"
            jq --arg p "$platform" '.[$p].SPDX' sbom-raw.json > "$out"
            if ! jq -e 'has("SPDXID") and has("spdxVersion")' "$out" > /dev/null; then
              echo "::error::${out} is not a bare SPDX document"
              exit 1
            fi
          done

      # One upload per platform: SecObserve keys a vulnerability check on the
      # file name, so both land instead of overwriting each other.
      - name: Upload the SBOMs to SecObserve
        id: sbom_upload
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SO_API_BASE_URL: https://webhooks.management.p4e.io/secobserve
          SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
          SO_PRODUCT_NAME: tranquila
          SO_BRANCH_NAME: ${{ github.ref_name }}
          SO_ORIGIN_SERVICE: tranquila
        run: |
          for sbom in sbom-linux-*.json; do
            docker run --rm -v "${PWD}:/workspace" -w /workspace \
              -e SO_API_BASE_URL -e SO_API_TOKEN -e SO_PRODUCT_NAME \
              -e SO_BRANCH_NAME -e SO_ORIGIN_SERVICE -e SO_FILE_NAME="$sbom" \
              --entrypoint /entrypoints/entrypoint_upload_sbom.sh \
              "$SCANNER_IMAGE"
          done

      # Scans the exact digest that was just signed, not a tag that could move
      # under it between the build and this step. Vulnerability observations
      # (CycloneDX, findings embedded) upload as part of the same action call.
      - name: Scan the image with Trivy and upload results to SecObserve
        id: trivy_scan
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: SecObserve/secobserve_actions_templates/actions/SCA/trivy_image@0a0f7d0981982a589f2a11c3f05c8e1c628fbd79 # v2026_08
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          target: ${{ env.IMAGE }}@${{ env.DIGEST }}
          report_name: trivy-image-report.cdx.json
          so_api_base_url: https://webhooks.management.p4e.io/secobserve
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: tranquila
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: tranquila
          so_origin_docker_image_name_tag: ${{ env.IMAGE }}:${{ steps.commit.outputs.short_sha }}

      # SecObserve is a findings tool, not a build gate: an outage there must
      # not fail a build whose image already built and signed.
      - name: Report the SecObserve upload outcome
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          SBOM_OUTCOME: ${{ steps.sbom_upload.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy_scan.outcome }}
        run: |
          failed=""
          if [ "$SBOM_OUTCOME" = "failure" ]; then failed="${failed} SBOM"; fi
          if [ "$TRIVY_OUTCOME" = "failure" ]; then failed="${failed} Trivy"; fi
          if [ -z "$failed" ]; then exit 0; fi
          echo "::warning::SecObserve upload failed for:${failed} - see the step logs"
          {
            echo "> [!WARNING]"
            echo "> SecObserve upload failed for:${failed}"
          } >> "$GITHUB_STEP_SUMMARY"
