name: Publish Helm chart

# The chart is versioned independently of the application: a push to main that
# raises version in charts/tranquila/Chart.yaml publishes it, anything else is a
# no-op.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/release_helm_chart.yml"

permissions:
  contents: read

jobs:
  release:
    uses: pflege-de-labs/github-workflows/.github/workflows/helm-release.yml@2cf5d3bd6cabe68176ae9a62b29177b3aa365ca2 # v1.2.0
    permissions:
      contents: write
      packages: write
      id-token: write
