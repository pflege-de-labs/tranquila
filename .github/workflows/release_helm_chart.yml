name: Publish Helm chart

# The chart is versioned independently of the application: a push to main that
# raises version in charts/tranquila/Chart.yaml publishes it, anything else is a
# no-op.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/release_helm_chart.yml"

permissions:
  contents: read

jobs:
  release:
    uses: pflege-de-labs/github-workflows/.github/workflows/helm-release.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
