name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Cheap and first, so a misplaced tag fails in seconds rather than after the
  # end-to-end suite and a two-platform build have already run.
  guard:
    uses: pflege-de-labs/github-workflows/.github/workflows/release-guard.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0

  # The release rebuilds its artifacts, so the tagged commit is gated here
  # rather than relying on the CI run of whatever was pushed to main.
  verify:
    needs: guard
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      go-version: stable
      modules: ". e2e"
      gosec-version: ""

  e2e:
    needs: guard
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [verify, e2e]
    uses: pflege-de-labs/github-workflows/.github/workflows/image-release.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version-check: true

  # Reports, never gates: an outage there must not withhold the release (ADR 0007).
  secobserve:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ github.ref_name }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}

  # needs: image — the GitHub release is the thing people see, so it is not
  # created until the image it documents is published and verified.
  binaries:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/go-binaries.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: write
      id-token: write
    with:
      name: tranquila
      package: .
      go-version: stable
